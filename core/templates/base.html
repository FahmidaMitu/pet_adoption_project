<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'pet_list' %}">🐾 Pet Rescue</a>
            <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'pet_list' %}">Pets</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'my_requests' %}">My Applications</a>
                <a class="nav-link" href="/admin/">Admin Panel</a>
                <span class="nav-link text-warning">Hi, {{ user.username }}</span>
                <a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Login</a>
                <a class="nav-link btn btn-outline-light btn-sm ms-2" href="{% url 'register' %}">Register</a>
            {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
