{% extends 'base.html' %}
{% block content %}
<h3>Adoption Application for {{ pet.name }}</h3>
<form method="POST" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" name="phone" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="2" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Why do you want this pet?</label>
        <textarea name="reason" class="form-control" rows="3" required></textarea>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="experience" class="form-check-input" id="exp">
        <label class="form-check-label" for="exp">Have you owned a pet before?</label>
    </div>
    <div class="mb-3">
        <label class="form-label">Additional Message</label>
        <textarea name="message" class="form-control" rows="2"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit Application</button>
</form>
{% endblock %}
